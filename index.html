<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17122b">
<title>جعبه‌بازی</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#17122b;--card:#241c45;--mint:#5ef2c0;--sun:#ffd23f;--pink:#ff5c8a;--text:#f3eeff;--dim:#9b90c4}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
header{padding:28px 0 18px}
h1{font-size:34px;font-weight:900;letter-spacing:-.5px}
header p{color:var(--dim);margin-top:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px}
.tab{flex:none;border:2px solid var(--dim);background:none;color:var(--dim);padding:8px 16px;border-radius:999px;font:inherit;font-size:14px}
.tab.on{background:var(--mint);border-color:var(--mint);color:#10241d;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.game{background:var(--card);border:0;color:inherit;font:inherit;text-align:right;padding:0;cursor:pointer;
 box-shadow:0 4px 0 0 #000,4px 0 0 0 #000,-4px 0 0 0 #000,0 -4px 0 0 #000;margin:4px}
.game:active{transform:translateY(3px)}
.art{height:110px;display:grid;place-items:center;font-size:52px;image-rendering:pixelated}
.info{padding:10px 12px 12px}
.info b{display:block;font-size:15px}
.info small{color:var(--dim);font-size:12px}
.soon{opacity:.55}
.soon .info small::after{content:" • به‌زودی";color:var(--sun)}
#player{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10}
#player.open{display:flex}
#bar{display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bg)}
#bar button{background:var(--pink);border:0;color:#fff;font:inherit;font-weight:700;padding:8px 16px;border-radius:10px}
#frame{flex:1;border:0;width:100%;background:#000}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:16px;right:16px;background:var(--sun);color:#2b2200;padding:12px 16px;border-radius:12px;display:none;z-index:20;font-weight:700}
</style>
</head>
<body>
<header><h1>جعبه‌بازی</h1><p>همه‌ی بازی‌های من، یک‌جا</p></header>
<div class="tabs" id="tabs"></div>
<main class="grid" id="grid"></main>
<div id="player"><div id="bar"><button id="back">بازگشت</button><span id="title"></span></div><iframe id="frame" allow="fullscreen; autoplay" title="بازی"></iframe></div>
<div id="toast"></div>
<script>
// برای افزودن بازی: فایل HTML را در پوشه‌ی games بگذارید و یک خط به این لیست اضافه کنید.
const GAMES=[
 {id:'pocket-dungeon',name:'Pocket Dungeon',cat:'ماجرایی',icon:'🗡️',c:['#3b2a7a','#1a5c4a'],file:'games/pocket-dungeon.html',ready:true},
 {id:'paper-bird',name:'پرنده کاغذی',cat:'آرکید',icon:'🕊️',c:['#ff8fab','#ffd23f'],file:'games/paper-bird.html',ready:true},
 {id:'splinter',name:'Stealth Agent',cat:'اکشن',icon:'🕶️',c:['#12343b','#2d6a4f'],file:'games/splinter-cell.html',ready:false},
 {id:'forest',name:'جنگل پاییزی',cat:'ماجرایی',icon:'🍂',c:['#b5541c','#5a3a1a'],file:'games/forest.html',ready:false},
 {id:'horror',name:'بازی ترسناک',cat:'ترسناک',icon:'👹',c:['#4a0e1e','#111'],file:'games/horror.html',ready:false},
 {id:'zombie',name:'بقا در زامبی‌ها',cat:'ترسناک',icon:'🧟',c:['#2e4a2a','#1a1a1a'],file:'games/zombie.html',ready:false}
];
const $=s=>document.querySelector(s);
let cat='همه';
function tabs(){const cs=['همه',...new Set(GAMES.map(g=>g.cat))];
 $('#tabs').innerHTML=cs.map(c=>`<button class="tab ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');}
function grid(){$('#grid').innerHTML=GAMES.filter(g=>cat==='همه'||g.cat===cat).map(g=>
 `<button class="game ${g.ready?'':'soon'}" data-id="${g.id}"><div class="art" style="background:linear-gradient(135deg,${g.c[0]},${g.c[1]})">${g.icon}</div><div class="info"><b>${g.name}</b><small>${g.cat}</small></div></button>`).join('');}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800);}
$('#tabs').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;tabs();grid();}};
$('#grid').onclick=async e=>{const b=e.target.closest('.game');if(!b)return;
 const g=GAMES.find(x=>x.id===b.dataset.id);
 if(!g.ready)return toast('این بازی هنوز آماده نیست');
 try{const r=await fetch(g.file,{method:'HEAD'});if(!r.ok)throw 0;}
 catch{return toast('فایل بازی در پوشه‌ی games پیدا نشد: '+g.file);}
 $('#title').textContent=g.name;$('#frame').src=g.file;$('#player').classList.add('open');};
$('#back').onclick=()=>{$('#player').classList.remove('open');$('#frame').src='about:blank';};
tabs();grid();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
